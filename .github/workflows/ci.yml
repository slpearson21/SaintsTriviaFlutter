name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  android:
    name: Analyze, test, and debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.50.0"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Validate question bank
        # Structure only. The bank is still draft, so this step does not pass
        # --require-approved. STRIV-19 should call
        # .github/workflows/validate-question-bank-release.yml for that gate.
        run: dart run tool/validate_questions.dart

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

  ios:
    name: iOS simulator build
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.50.0"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS simulator (no codesign)
        run: flutter build ios --simulator --no-codesign
